---
x-zammad-service: &zammad-service
  image: ${IMAGE_REPO:-ghcr.io/zammad/zammad}:${VERSION:-7.0.1-0019}
  restart: unless-stopped
  environment: &zammad-environment
    MEMCACHE_SERVERS: ${MEMCACHE_SERVERS:-zammad-memcached:11211}
    POSTGRESQL_DB: ${POSTGRES_DB:-zammad_production}
    POSTGRESQL_HOST: ${POSTGRES_HOST:-zammad-postgresql}
    POSTGRESQL_USER: ${POSTGRES_USER:-zammad}
    POSTGRESQL_PASS: ${POSTGRES_PASS:-zammad}
    POSTGRESQL_PORT: ${POSTGRES_PORT:-5432}
    POSTGRESQL_OPTIONS: ${POSTGRESQL_OPTIONS:-?pool=50}
    POSTGRESQL_DB_CREATE: "true"
    REDIS_URL: ${REDIS_URL:-redis://zammad-redis:6379}
    BACKUP_DIR: /var/tmp/zammad
    BACKUP_TIME: "03:00"
    HOLD_DAYS: "10"
    TZ: ${TZ:-Europe/Berlin}
    AUTOWIZARD_JSON: ${AUTOWIZARD_JSON:-}
    ELASTICSEARCH_ENABLED: "true"
    ELASTICSEARCH_SCHEMA: ${ELASTICSEARCH_SCHEMA:-http}
    ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-zammad-elasticsearch}
    ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
    ELASTICSEARCH_USER: ${ELASTICSEARCH_USER:-elastic}
    ELASTICSEARCH_PASS: ${ELASTICSEARCH_PASS:-zammad}
    ELASTICSEARCH_NAMESPACE: ${ELASTICSEARCH_NAMESPACE:-zammad}
    ELASTICSEARCH_REINDEX: ${ELASTICSEARCH_REINDEX:-}
    NGINX_PORT: ${NGINX_PORT:-8080}
    ZAMMAD_HTTP_TYPE: ${ZAMMAD_HTTP_TYPE:-http}
    ZAMMAD_FQDN: ${ZAMMAD_FQDN:-localhost}
    RAILS_TRUSTED_PROXIES: ${RAILS_TRUSTED_PROXIES:-127.0.0.1,::1}
  volumes:
    - zammad-storage:/opt/zammad/storage
    - zammad-backup:/var/tmp/zammad:ro

services:
  zammad-backup:
    <<: *zammad-service
    container_name: playground-zammad-backup
    command: ["zammad-backup"]
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage
    user: "0:0"

  zammad-elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-9.3.3}
    container_name: playground-zammad-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - zammad-elasticsearch-data:/usr/share/elasticsearch/data

  zammad-init:
    <<: *zammad-service
    container_name: playground-zammad-init
    command: ["zammad-init"]
    depends_on:
      - zammad-postgresql
      - zammad-elasticsearch
      - zammad-redis
      - zammad-memcached
    restart: on-failure
    user: "0:0"

  zammad-memcached:
    image: memcached:${MEMCACHE_VERSION:-1.6.41-alpine}
    container_name: playground-zammad-memcached
    command: memcached -m 256M
    restart: unless-stopped

  zammad-nginx:
    <<: *zammad-service
    container_name: playground-zammad-nginx
    command: ["zammad-nginx"]
    depends_on:
      - zammad-railsserver
    expose:
      - "${NGINX_PORT:-8080}"
    ports:
      - "${NGINX_EXPOSE_PORT:-8090}:${NGINX_PORT:-8080}"

  zammad-postgresql:
    image: postgres:${POSTGRES_VERSION:-17.9-alpine}
    container_name: playground-zammad-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zammad_production}
      POSTGRES_USER: ${POSTGRES_USER:-zammad}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-zammad}
    volumes:
      - zammad-postgresql-data:/var/lib/postgresql/data

  zammad-railsserver:
    <<: *zammad-service
    container_name: playground-zammad-railsserver
    command: ["zammad-railsserver"]

  zammad-redis:
    image: redis:${REDIS_VERSION:-8.6.2-alpine}
    container_name: playground-zammad-redis
    restart: unless-stopped
    volumes:
      - zammad-redis-data:/data

  zammad-scheduler:
    <<: *zammad-service
    container_name: playground-zammad-scheduler
    command: ["zammad-scheduler"]

  zammad-websocket:
    <<: *zammad-service
    container_name: playground-zammad-websocket
    command: ["zammad-websocket"]

volumes:
  zammad-backup:
  zammad-elasticsearch-data:
  zammad-postgresql-data:
  zammad-redis-data:
  zammad-storage:
